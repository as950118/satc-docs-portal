version: '3.8'

services:
  # 프로덕션 빌드
  docs-front:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - docs-network

  # 개발 환경 (선택사항)
  docs-front-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - docs-network
    profiles:
      - dev

networks:
  docs-network:
    driver: bridge
