version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.3-alpine
    container_name: satc-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docs}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Elasticsearch
  # satc-mcp-server가 이미 띄운 elasticsearch 컨테이너(satc-mcp-network)를 공유해서 씀.
  # 같은 ES 클러스터 안에서 이 프로젝트는 document_chunks 인덱스를,
  # satc-mcp-server는 full_documents 인덱스를 각자 사용하므로 인스턴스를 두 개 띄울 필요 없음.
  # (아래 shared-es 네트워크 + indexing 서비스의 ELASTICSEARCH_HOST=elasticsearch 참고)

  # MinIO Object Storage
  minio:
    # Docker Hub의 minio/minio는 더 이상 pull 불가 (deprecated) → quay.io 미러 사용
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: satc-docs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - docs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satc-docs-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-satc}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-docs}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # 파일 저장소(S3 호환). 비우면 minio 컨테이너를 쓴다. Supabase Storage 는 docs/storage.md
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-${MINIO_BUCKET_NAME:-docs}}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-${MINIO_ACCESS_KEY:-minioadmin}}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-${MINIO_SECRET_KEY:-minioadmin}}
      - STORAGE_PATH_STYLE=${STORAGE_PATH_STYLE:-true}
      - STORAGE_MANAGE_BUCKET=${STORAGE_MANAGE_BUCKET:-true}
      - STORAGE_PUBLIC_READ=${STORAGE_PUBLIC_READ:-true}
      - STORAGE_ASCII_KEYS=${STORAGE_ASCII_KEYS:-false}
      - DOCS_MAX_UPLOAD_SIZE=${DOCS_MAX_UPLOAD_SIZE:-50MB}
      - DOCS_MAX_REQUEST_SIZE=${DOCS_MAX_REQUEST_SIZE:-100MB}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - EXTERNAL_API_HOST=http://indexing
      - EXTERNAL_API_PORT=${INDEXING_PORT:-8000}
      - EXTERNAL_API_ENABLED=${EXTERNAL_API_ENABLED:-true}
      - DOCS_AUTH_TOKEN_SECRET=${DOCS_AUTH_TOKEN_SECRET:-}
      - DOCS_AUTH_TOKEN_TTL=${DOCS_AUTH_TOKEN_TTL:-12h}
      - DOCS_AUTH_DEV_ACCOUNTS=${DOCS_AUTH_DEV_ACCOUNTS:-false}
      - DOCS_AUTH_ADMIN_USERNAME=${DOCS_AUTH_ADMIN_USERNAME:-}
      - DOCS_AUTH_ADMIN_PASSWORD=${DOCS_AUTH_ADMIN_PASSWORD:-}
      - DOCS_OAUTH_ISSUER=${DOCS_OAUTH_ISSUER:-http://localhost:${BACKEND_PORT:-8080}}
      - DOCS_OAUTH_CONSENT_URL=${DOCS_OAUTH_CONSENT_URL:-http://localhost:${FRONTEND_PORT:-3000}/oauth/consent}
      - DOCS_OAUTH_TOKEN_TTL=${DOCS_OAUTH_TOKEN_TTL:-168h}
      - DOCS_OAUTH_ALLOWED_REDIRECT_URIS=${DOCS_OAUTH_ALLOWED_REDIRECT_URIS:-}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - docs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Indexing Service (FastAPI)
  indexing:
    build:
      context: ./indexing
      dockerfile: Dockerfile
    container_name: satc-docs-indexing
    restart: unless-stopped
    environment:
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-${MINIO_BUCKET_NAME:-docs}}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-${MINIO_ACCESS_KEY:-minioadmin}}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-${MINIO_SECRET_KEY:-minioadmin}}
      - STORAGE_PATH_STYLE=${STORAGE_PATH_STYLE:-true}
      - STORAGE_MANAGE_BUCKET=${STORAGE_MANAGE_BUCKET:-true}
      - STORAGE_PUBLIC_READ=${STORAGE_PUBLIC_READ:-true}
      # satc-mcp-server 쪽 elasticsearch 컨테이너를 shared-es 네트워크 경유로 공유 (컨테이너명으로 접근)
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-document_chunks}
      - QUEUE_MAX_WORKERS=${QUEUE_MAX_WORKERS:-4}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${INDEXING_PORT:-8000}
      - DEBUG=${DEBUG:-false}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
      - MIN_CHUNK_LENGTH=${MIN_CHUNK_LENGTH:-100}
      - BACKEND_API_HOST=backend
      - BACKEND_API_PORT=8080
    ports:
      - "${INDEXING_PORT:-8000}:8000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - docs-network
      - shared-es

  # Frontend Service (Vue.js + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: satc-docs-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_JENKINS_URL=${VITE_JENKINS_URL:-}
      - VITE_ARGOCD_URL=${VITE_ARGOCD_URL:-}
      - VITE_COMMON_CODE_URL=${VITE_COMMON_CODE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docs-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  docs-network:
    driver: bridge
    name: satc-docs-network
  # satc-mcp-server의 docker-compose.yml이 만든 네트워크를 그대로 공유해서
  # 그 안의 elasticsearch 컨테이너를 컨테이너명으로 직접 접근한다.
  # (satc-mcp-server 스택이 먼저 떠 있어야 함)
  shared-es:
    external: true
    name: satc-mcp-network
