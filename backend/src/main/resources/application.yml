spring:
  application:
    name: docs-portal-back
  datasource:
    hikari:
      initialization-fail-timeout: 60000
    url: jdbc:postgresql://127.0.0.1:5432/docs
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      # 업로드 파일 하나와 요청 전체의 상한(스프링 기본값은 1MB, 10MB). 넘으면 413 을 돌려준다
      max-file-size: ${DOCS_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${DOCS_MAX_REQUEST_SIZE:100MB}

# 문서 파일 저장소(S3 호환: MinIO, Supabase Storage, Cloudflare R2). 비어 있는 항목은 기본값을 쓰고,
# endpoint·bucket·access-key·secret-key 는 아래 minio.* 값을 쓴다. 검증 규칙은 StorageConfig 참고
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:}
  bucket: ${STORAGE_BUCKET:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style: ${STORAGE_PATH_STYLE:}
  manage-bucket: ${STORAGE_MANAGE_BUCKET:}
  public-read: ${STORAGE_PUBLIC_READ:}
  ascii-keys: ${STORAGE_ASCII_KEYS:}

# 예전 MinIO 설정(MINIO_HOST, MINIO_PORT, MINIO_CLIENT_ID, MINIO_CLIENT_SECRET, MINIO_BUCKET_NAME). storage.* 가 비어 있을 때만 쓴다
minio:
  host: 127.0.0.1
  port: 9000
  client-id: minioadmin
  client-secret: minioadmin
  bucket-name: docs

cors:
  # 프론트엔드 Origin 목록(쉼표 구분). 비어 있으면 기동 실패, dev 프로필은 localhost:3000 을 쓴다
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

external:
  api:
    host: http://127.0.0.1
    port: 8000
    enabled: true
    
docs:
  api:
    # 문서 API(/api/v1/docs/**) 인증. 읽기는 로그인 사용자, 쓰기는 Roles.DOCUMENT_WRITERS, 상태 콜백은 내부 토큰. false 면 누구나 부를 수 있다
    auth-required: ${DOCS_API_AUTH_REQUIRED:true}
  internal:
    # indexing → backend 상태 콜백(POST /api/v1/docs/status)의 X-Internal-Token. indexing 에도 같은 값을 준다.
    # 인증을 켰는데 비어 있으면 dev 프로필 외에는 기동 실패
    token: ${DOCS_INTERNAL_TOKEN:}
  db:
    # 테이블을 둘 PostgreSQL 스키마. 비우면 search_path 기본값(public), 정하면 기동 시 스키마를 만들고 그 안에 둔다 (DbSchemaConfig)
    schema: ${DOCS_DB_SCHEMA:}
  sync:
    # 코드 → 문서 동기화 토큰 (ARCH-0001). 비어 있으면 PUT /api/v1/docs/sync 비활성
    token: ${DOCS_SYNC_TOKEN:}
  auth:
    # 로그인 토큰(HS256) 서명 키, 32바이트 이상. 비어 있으면 dev 프로필에서만 기동마다 임시 키를 쓰고 그 외에는 기동 실패
    token-secret: ${DOCS_AUTH_TOKEN_SECRET:}
    token-ttl: ${DOCS_AUTH_TOKEN_TTL:12h}
    # 개발용 계정 8개(비밀번호 <이름>123)를 없을 때만 만든다. dev 프로필은 true
    dev-accounts: ${DOCS_AUTH_DEV_ACCOUNTS:false}
    # 둘 다 설정하면 해당 username 이 없을 때만 ADMIN 계정을 만든다
    initial-admin:
      username: ${DOCS_AUTH_ADMIN_USERNAME:}
      password: ${DOCS_AUTH_ADMIN_PASSWORD:}
  oauth:
    # MCP 클라이언트용 OAuth 인가 서버. issuer 는 클라이언트가 이 백엔드에 접근하는 공개 주소, consent-url 은 프론트엔드 동의 화면.
    # 둘 중 하나라도 비어 있으면 기동 실패, dev 프로필은 localhost 주소를 쓴다
    issuer: ${DOCS_OAUTH_ISSUER:}
    consent-url: ${DOCS_OAUTH_CONSENT_URL:}
    token-ttl: ${DOCS_OAUTH_TOKEN_TTL:168h}
    # 루프백(127.0.0.1, [::1], localhost) 외에 등록을 허용할 redirect_uri, 쉼표 구분·정확히 일치
    allowed-redirect-uris: ${DOCS_OAUTH_ALLOWED_REDIRECT_URIS:}
