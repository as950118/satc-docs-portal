spring:
  application:
    name: docs-portal-back
  datasource:
    hikari:
      initialization-fail-timeout: 60000
    url: jdbc:postgresql://127.0.0.1:5432/docs
    username: postgres
    password: okestro2018

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

minio:
  host: 127.0.0.1
  port: 9000
  client-id: minioadmin
  client-secret: minioadmin
  bucket-name: cmp-docs

cors:
  host: http://127.0.0.1:3000

external:
  api:
    host: http://127.0.0.1
    port: 8000
    enabled: true
    
docs:
  sync:
    # 코드 → 문서 동기화 토큰 (ARCH-0001). 비어 있으면 PUT /api/v1/docs/sync 비활성
    token: ${DOCS_SYNC_TOKEN:}
  internal:
    # 인덱싱 서비스 → POST /api/v1/docs/status 콜백 토큰 (ADR-0005). 인덱싱 서비스의 BACKEND_INTERNAL_TOKEN 과 같은 값
    token: ${DOCS_INTERNAL_TOKEN:}
  auth:
    # 문서 API 인증 (ADR-0005). 긴급 롤백 시 false
    enabled: ${DOCS_AUTH_ENABLED:true}

auth:
  session:
    ttl-hours: ${AUTH_SESSION_TTL_HOURS:12}
